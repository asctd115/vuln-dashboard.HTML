<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Meeting Docket</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:#f6f8fa;color:#1a1a2e;min-height:100vh;}
.app-header{background:#010409;border-bottom:1px solid #21262d;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.app-header h1{font-size:16px;font-weight:600;color:#58a6ff;display:flex;align-items:center;gap:8px;}
.app-header .nav-links{display:flex;gap:8px;}
.app-header a{color:#8b949e;font-size:12px;text-decoration:none;padding:5px 12px;border:1px solid #30363d;border-radius:6px;transition:all .15s;}
.app-header a:hover{color:#e6edf3;border-color:#58a6ff;}
.container{max-width:900px;margin:0 auto;padding:24px;}
.tabs{display:flex;gap:4px;background:#e8eaed;border-radius:8px;padding:3px;margin-bottom:24px;width:fit-content;}
.tab{padding:7px 16px;border-radius:6px;font-size:13px;cursor:pointer;border:none;background:transparent;color:#6b7280;transition:all .15s;font-family:'Segoe UI',sans-serif;}
.tab.active{background:#fff;color:#1a1a2e;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.page{display:none;}.page.active{display:block;}
.card{background:#fff;border:1px solid #e1e4e8;border-radius:12px;padding:20px 24px;margin-bottom:16px;}
.section-label{font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;}
input[type=text],input[type=date],textarea,select{width:100%;background:#fff;border:1px solid #d1d5db;border-radius:7px;padding:8px 12px;font-size:13px;color:#1a1a2e;font-family:'Segoe UI',sans-serif;transition:border .15s;}
input:focus,textarea:focus,select:focus{outline:none;border-color:#58a6ff;box-shadow:0 0 0 3px rgba(88,166,255,.15);}
textarea{resize:vertical;line-height:1.6;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.row3{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;}
.item-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.item-row .main{flex:1;}
.item-row .owner{width:140px;}
.item-row .due{width:130px;}
.flag-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.flag-row .sev{width:120px;}
.flag-row .main{flex:1;}
button.add-btn{background:transparent;border:1px dashed #d1d5db;border-radius:7px;padding:7px 14px;font-size:12px;cursor:pointer;color:#6b7280;display:inline-flex;align-items:center;gap:6px;transition:all .15s;font-family:'Segoe UI',sans-serif;margin-top:4px;}
button.add-btn:hover{border-color:#58a6ff;color:#58a6ff;background:#f0f7ff;}
button.remove-btn{background:none;border:none;cursor:pointer;color:#9ca3af;padding:4px;border-radius:4px;line-height:1;flex-shrink:0;}
button.remove-btn:hover{color:#ef4444;}
button.primary{background:#1a1a2e;border:none;border-radius:8px;padding:9px 20px;font-size:13px;cursor:pointer;color:#fff;font-family:'Segoe UI',sans-serif;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:opacity .15s;}
button.primary:hover{opacity:.85;}
button.secondary{background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;color:#374151;font-family:'Segoe UI',sans-serif;display:inline-flex;align-items:center;gap:7px;transition:all .15s;}
button.secondary:hover{background:#f9fafb;border-color:#9ca3af;}
button.copy-btn{background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;color:#374151;font-family:'Segoe UI',sans-serif;display:inline-flex;align-items:center;gap:6px;transition:all .15s;}
button.copy-btn:hover{background:#f9fafb;}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid #e1e4e8;background:#f9fafb;color:#6b7280;transition:all .15s;
